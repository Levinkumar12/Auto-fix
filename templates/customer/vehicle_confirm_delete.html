{% extends 'base.html' %}

{% block title %}Delete Vehicle - Auto Fix{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card card-custom p-4 bg-white text-center">
                <div class="p-3 bg-danger-subtle text-danger rounded-circle mx-auto mb-3 d-inline-block">
                    <i class="bi bi-trash fs-2"></i>
                </div>
                <h4 class="fw-bold">Remove Vehicle?</h4>
                <p class="text-muted">Are you sure you want to delete <strong>{{ vehicle.vehicle_name }}</strong> ({{ vehicle.vehicle_number }})?</p>

                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3 mt-4">
                        <a href="{% url 'vehicle_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4 fw-bold">Delete Vehicle</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
