{% extends 'base.html' %}

{% block title %}Login - Auto Fix{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card card-custom p-4">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-primary-subtle text-primary mx-auto mb-2 d-flex align-items-center justify-content-center" style="width: 60px; height: 60px; font-size: 1.8rem;">
                        <i class="bi bi-lock-fill"></i>
                    </div>
                    <h3 class="fw-bold">Sign In</h3>
                    <p class="text-muted small">Access your Customer, Mechanic, or Admin Portal</p>
                </div>

                <form method="POST" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary py-2 fw-bold">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                        </button>
                    </div>
                </form>

                <div class="text-center pt-3 border-top">
                    <p class="small text-muted mb-2">Don't have an account yet?</p>
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'register_customer' %}" class="btn btn-sm btn-outline-primary">Register as Customer</a>
                        <a href="{% url 'register_mechanic' %}" class="btn btn-sm btn-outline-warning text-dark">Register as Mechanic</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
